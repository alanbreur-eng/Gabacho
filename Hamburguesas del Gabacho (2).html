<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hamburguesas del Gabacho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky category tabs over a single-column menu; fixed order bar opens an order sheet that sends the order to WhatsApp. Brand look: deep red ground, mustard accents, committed single theme. */
:root {
  --bg: #7d1409;
  --bg-deep: #5e0e06;
  --card: #96190d;
  --line: #b8392b;
  --fg: #fff4dc;
  --muted: #f0bfa8;
  --accent: #f6b834;
  --accent-ink: #4a0d05;
  --wa: #25d366;
  --wa-ink: #05361a;
  --font-display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 7rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg-deep); z-index: 30; }
.wrap { max-width: 680px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 1rem; padding-block: 1.25rem 1rem; }
header img { width: 84px; height: 84px; border-radius: 50%; flex: none; border: 3px solid var(--accent); object-fit: cover; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.1rem, 9vw, 3rem); line-height: .95; margin: 0; letter-spacing: .02em; color: var(--accent); text-wrap: balance; }
header p { margin: .35rem 0 0; color: var(--muted); font-weight: 700; font-size: .9rem; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg-deep); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: .6rem max(16px, env(safe-area-inset-right, 0px)) .6rem max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; }
nav a { flex: none; color: var(--fg); text-decoration: none; font-family: var(--font-display); letter-spacing: .06em; font-size: 1.2rem; padding: .25rem .9rem; border: 2px solid var(--line); border-radius: 999px; }
nav a:hover, nav a:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
section { padding-top: 1.6rem; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; letter-spacing: .04em; margin: 0 0 .25rem; color: var(--accent); }
.sub { margin: 0 0 .9rem; color: var(--muted); font-size: .9rem; font-weight: 700; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); align-items: start; }
.item h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; letter-spacing: .03em; line-height: 1.05; }
.item p { margin: .3rem 0 0; color: var(--muted); font-size: .92rem; max-width: 46ch; }
.price { font-family: var(--font-display); font-size: 1.7rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.item.has-photo { grid-template-columns: 104px minmax(0, 1fr) auto; }
.ph { grid-row: 1 / span 2; width: 104px; height: 104px; border-radius: 12px; object-fit: cover; align-self: start; }
.item.has-photo .ctl { grid-column: 2 / -1; align-self: end; }
.ctl { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
.add { font: 800 .95rem var(--font-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: .55rem 1.3rem; cursor: pointer; }
.add:active { transform: scale(.97); }
.step { display: inline-flex; align-items: center; gap: .2rem; background: var(--bg-deep); border-radius: 999px; padding: .2rem; }
.step button { width: 2.4rem; height: 2.4rem; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 800 1.3rem var(--font-body); cursor: pointer; line-height: 1; }
.step output { min-width: 2.2rem; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; font-weight: 700; }
footer b { color: var(--fg); user-select: all; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: .8rem max(16px, env(safe-area-inset-right, 0px)) calc(.8rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg-deep); border-top: 2px solid var(--accent); }
.bar button { display: flex; width: 100%; max-width: 680px; margin: 0 auto; justify-content: space-between; align-items: center; gap: 1rem; font: 800 1.05rem var(--font-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: .95rem 1.2rem; cursor: pointer; }
.bar button[disabled] { background: var(--card); color: var(--muted); cursor: default; }
.bar .t { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .03em; font-variant-numeric: tabular-nums; }

.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(30, 4, 1, .72); display: flex; align-items: flex-end; justify-content: center; }
.panel { width: 100%; max-width: 680px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; border-top: 3px solid var(--accent); padding: 1.1rem max(16px, env(safe-area-inset-right, 0px)) calc(1.2rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel h2 { display: flex; justify-content: space-between; align-items: center; }
.close { background: none; border: 2px solid var(--line); color: var(--fg); border-radius: 50%; width: 2.4rem; height: 2.4rem; font-size: 1.2rem; cursor: pointer; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .8rem; align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.line b { font-weight: 800; }
.line .amt { font-variant-numeric: tabular-nums; font-weight: 800; text-align: right; }
.line .step { grid-column: 1 / -1; justify-self: start; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: .9rem 0; font-family: var(--font-display); font-size: 1.9rem; letter-spacing: .03em; }
.total span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: .3rem; margin-top: .8rem; }
.field label, legend { font-weight: 800; font-size: .85rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
input[type=text], textarea { font: 600 1rem var(--font-body); color: var(--fg); background: var(--bg-deep); border: 2px solid var(--line); border-radius: 10px; padding: .7rem .8rem; width: 100%; }
textarea { min-height: 4.5rem; resize: vertical; }
fieldset { border: 0; padding: 0; margin: .8rem 0 0; display: flex; gap: .6rem; flex-wrap: wrap; }
fieldset legend { padding: 0; margin-bottom: .3rem; width: 100%; }
.opt { flex: 1 1 8rem; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: block; text-align: center; padding: .7rem; border: 2px solid var(--line); border-radius: 10px; font-weight: 800; cursor: pointer; }
.opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt input:focus-visible + span { outline: 3px solid var(--fg); outline-offset: 2px; }
.send { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-top: 1.1rem; padding: 1rem; border-radius: 14px; background: var(--wa); color: var(--wa-ink); font-weight: 800; font-size: 1.1rem; text-decoration: none; }
.send[aria-disabled=true] { opacity: .45; pointer-events: none; }
.hint { color: var(--muted); font-size: .85rem; margin: .6rem 0 0; min-height: 1.2em; }
.ghost { margin-top: .7rem; width: 100%; background: none; border: 2px solid var(--line); color: var(--fg); border-radius: 12px; padding: .7rem; font: 800 .95rem var(--font-body); cursor: pointer; }
.empty { color: var(--muted); padding: 1rem 0; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .add:active { transform: none; } }
</style>

const items = {};
const $ = (s) => document.querySelector(s);
const money = (n) => "$" + n;
let cart = {};

const menuEl = $("#menu");
MENU.forEach((cat) => {
  const sec = document.createElement("section");
  sec.id = cat.id;
  sec.innerHTML = `<h2>${cat.title}</h2>${cat.sub ? `<p class="sub">${cat.sub}</p>` : ""}<div class="list"></div>`;
  const list = sec.querySelector(".list");
  cat.items.forEach(([name, price, desc]) => {
    const key = name;
    items[key] = { name, price };
    const row = document.createElement("div");
    row.className = "item" + (PHOTOS[name] ? " has-photo" : "");
    row.dataset.key = key;
    row.innerHTML = `<div><h3></h3>${desc ? "<p></p>" : ""}</div><div class="price">${money(price)}</div><div class="ctl"></div>`;
    if (PHOTOS[name]) { const im = document.createElement("img"); im.className = "ph"; im.alt = name; im.loading = "lazy"; im.src = PHOTOS[name]; row.prepend(im); }
    row.querySelector("h3").textContent = name;
    if (desc) row.querySelector("p").textContent = desc;
    list.appendChild(row);
  });
  menuEl.appendChild(sec);
});

function stepper(key, qty) {
  return `<div class="step"><button type="button" data-act="dec" data-key="${key.replace(/"/g, "&quot;")}" aria-label="Quitar uno">−</button><output>${qty}</output><button type="button" data-act="inc" data-key="${key.replace(/"/g, "&quot;")}" aria-label="Agregar uno">+</button></div>`;
}

function renderRows() {
  document.querySelectorAll(".item").forEach((row) => {
    const key = row.dataset.key;
    const q = cart[key] || 0;
    row.querySelector(".ctl").innerHTML = q
      ? stepper(key, q)
      : `<button class="add" type="button" data-act="inc" data-key="${key.replace(/"/g, "&quot;")}">Agregar</button>`;
  });
}

function totals() {
  let n = 0, t = 0;
  for (const k in cart) { n += cart[k]; t += cart[k] * items[k].price; }
  return { n, t };
}

function orderText() {
  const mode = "domicilio";
  const name = $("#name").value.trim();
  const addr = $("#addr").value.trim();
  const note = $("#note").value.trim();
  const { t } = totals();
  const lines = Object.keys(cart).map((k) => `${cart[k]} x ${items[k].name} - ${money(cart[k] * items[k].price)}`);
  let msg = `*Pedido - Hamburguesas del Gabacho*\n\n${lines.join("\n")}\n\n*Total: ${money(t)}*\n\n`;
  msg += `Nombre: ${name}\n`;
  msg += `A domicilio\nDirección: ${addr}\n`;
  if (note) msg += `Comentarios: ${note}\n`;
  return msg;
}

function refresh() {
  renderRows();
  const { n, t } = totals();
  const btn = $("#open");
  btn.disabled = n === 0;
  $("#count").textContent = n ? `Ver pedido · ${n} ${n === 1 ? "artículo" : "artículos"}` : "Agrega algo a tu pedido";
  $("#barTotal").textContent = n ? money(t) : "";
  $("#total").textContent = money(t);
  const keys = Object.keys(cart);
  $("#lines").innerHTML = keys.length ? keys.map((k) => `<div class="line"><b>${items[k].name}</b><span class="amt">${money(cart[k] * items[k].price)}</span>${stepper(k, cart[k])}</div>`).join("") : `<p class="empty">Tu pedido está vacío.</p>`;
  updateSend();
}

function updateSend() {
  const mode = "domicilio";
  const ok = totals().n > 0 && $("#name").value.trim() && $("#addr").value.trim();
  const a = $("#send");
  a.setAttribute("aria-disabled", ok ? "false" : "true");
  a.href = ok ? `https://wa.me/${PHONE}?text=${encodeURIComponent(orderText())}` : "#";
  $("#hint").textContent = ok ? "Se abrirá WhatsApp con tu pedido listo. Toca enviar ahí para confirmarlo." : "Escribe tu nombre y tu dirección para enviar.";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const k = b.dataset.key;
  cart[k] = (cart[k] || 0) + (b.dataset.act === "inc" ? 1 : -1);
  if (cart[k] <= 0) delete cart[k];
  if (!Object.keys(cart).length) $("#sheet").hidden = true;
  refresh();
});
$("#open").addEventListener("click", () => { $("#sheet").hidden = false; updateSend(); });
$("#close").addEventListener("click", () => { $("#sheet").hidden = true; });
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
["#name", "#addr", "#note"].forEach((s) => $(s).addEventListener("input", updateSend));
$("#send").addEventListener("click", (e) => { if ($("#send").getAttribute("aria-disabled") === "true") e.preventDefault(); });
$("#copy").addEventListener("click", async () => {
  const txt = orderText();
  try { await navigator.clipboard.writeText(txt); $("#copy").textContent = "Pedido copiado"; }
  catch (_) { $("#copy").textContent = "No se pudo copiar"; }
  setTimeout(() => { $("#copy").textContent = "Copiar pedido"; }, 1800);
});

refresh();
</script>

</body></html>
